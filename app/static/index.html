<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Intelligence</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f6f9;
            color: #202938;
        }
        
        .card {
            background: white;
            padding: 24px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }
        
        button {
            padding: 10px 16px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background: #2457d6;
            color: white;
            cursor: pointer;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        
        input {
            display: block;
            margin-top: 12px;
        }
        
        .status {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        
        .document {
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .muted {
            color: #5b6472;
        }
    </style>
</head>

<body>
    <h1>AI Document Intelligence</h1>
    <p class="muted">Upload a TXT or PDF document and generate an AI summary.</p>

    <section class="card">
        <h2>Summarize a document</h2>

        <form id="uploadForm">
            <label for="file">Choose a TXT or PDF file</label>
            <input id="file" name="file" type="file" accept=".txt,.pdf" required>
            <button id="uploadButton" type="submit">
                Upload and summarize
            </button>
        </form>

        <p id="status" class="status" role="status"></p>
        <div id="summaryResult"></div>
    </section>

    <section class="card">
        <h2>Saved documents</h2>
        <button id="refreshButton" type="button">
            Refresh document list
        </button>
        <div id="documentList"></div>
    </section>


    <section class="card">
        <h2>Ask a question about a saved document</h2>
        <p class="muted">
            Select a previously saved document and ask a question without uploading it again.
        </p>

        <form id="savedQuestionForm">
            <label for="savedDocumentId">Saved document</label>
            <select id="savedDocumentId" required>
                <option value="">Loading saved documents...</option>
            </select>

            <label for="savedQuestion">Your question</label>
            <textarea id="savedQuestion" rows="3" placeholder="Example: What are the main conclusions?" minlength="3" maxlength="1000" required></textarea>

            <button id="savedQuestionButton" type="submit">
                Ask about saved document
            </button>
        </form>

        <p id="savedQuestionStatus" class="status" role="status"></p>
        <div id="savedAnswerResult"></div>
    </section>



    <script>
        const uploadForm = document.getElementById("uploadForm");
        const fileInput = document.getElementById("file");
        const uploadButton = document.getElementById("uploadButton");
        const statusBox = document.getElementById("status");
        const summaryResult = document.getElementById("summaryResult");
        const documentList = document.getElementById("documentList");
        const refreshButton = document.getElementById("refreshButton");
        const savedQuestionForm = document.getElementById("savedQuestionForm");
        const savedDocumentId = document.getElementById("savedDocumentId");
        const savedQuestion = document.getElementById("savedQuestion");
        const savedQuestionButton = document.getElementById("savedQuestionButton");
        const savedQuestionStatus = document.getElementById("savedQuestionStatus");
        const savedAnswerResult = document.getElementById("savedAnswerResult");


        uploadForm.addEventListener("submit", async(event) => {
            event.preventDefault();

            const file = fileInput.files[0];

            if (!file) {
                statusBox.textContent = "Please choose a file first.";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            uploadButton.disabled = true;
            statusBox.textContent = "Uploading and summarizing...";
            summaryResult.replaceChildren();

            try {
                const response = await fetch("/documents/summarize", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "The request failed.");
                }

                statusBox.textContent = "Document summarized and saved.";

                const heading = document.createElement("h3");
                heading.textContent = data.filename;

                const summary = document.createElement("p");
                summary.textContent = data.summary;

                const metadata = document.createElement("p");
                metadata.textContent =
                    `Document ID: ${data.document_id} | ` +
                    `Words: ${data.word_count} | ` +
                    `Type: ${data.file_type}`;

                summaryResult.append(heading, summary, metadata);

                await loadDocuments();
                await loadSavedDocumentOptions();
            } catch (error) {
                statusBox.textContent = `Error: ${error.message}`;
            } finally {
                uploadButton.disabled = false;
            }
        });

        async function loadDocuments() {
            documentList.textContent = "Loading documents...";

            try {
                const response = await fetch("/documents");
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Could not load documents.");
                }

                documentList.replaceChildren();

                if (data.documents.length === 0) {
                    documentList.textContent = "No saved documents yet.";
                    return;
                }


                for (const doc of data.documents) {
                    const item = document.createElement("div");
                    item.className = "document";

                    const title = document.createElement("strong");
                    title.textContent = doc.filename;

                    const details = document.createElement("p");
                    details.className = "muted";
                    details.textContent =
                        `ID: ${doc.id} | ` +
                        `${doc.file_type} | ` +
                        `${doc.word_count} words`;

                    const summary = document.createElement("p");
                    summary.textContent = doc.summary;

                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.textContent = "Delete";
                    deleteButton.setAttribute(
                        "aria-label",
                        `Delete ${doc.filename}`
                    );

                    deleteButton.addEventListener("click", async() => {
                        const confirmed = window.confirm(
                            `Are you sure you want to delete "${doc.filename}"? This action cannot be undone.`
                        );

                        if (!confirmed) {
                            return;
                        }

                        deleteButton.disabled = true;
                        deleteButton.textContent = "Deleting...";

                        try {
                            const response = await fetch(
                                `/documents/${encodeURIComponent(doc.id)}`, {
                                    method: "DELETE"
                                }
                            );

                            const data = await response.json();

                            if (!response.ok) {
                                throw new Error(
                                    data.detail || "Could not delete the document."
                                );
                            }

                            statusBox.textContent =
                                `Deleted "${doc.filename}" successfully.`;

                            savedAnswerResult.replaceChildren();
                            savedQuestionStatus.textContent = "";

                            await loadDocuments();
                            await loadSavedDocumentOptions();
                        } catch (error) {
                            statusBox.textContent = `Delete failed: ${error.message}`;
                            deleteButton.disabled = false;
                            deleteButton.textContent = "Delete";
                        }
                    });

                    item.append(title, details, summary, deleteButton);
                    documentList.append(item);
                }

            } catch (error) {
                documentList.textContent = `Error: ${error.message}`;
            }
        }

        refreshButton.addEventListener("click", async() => {
            await loadDocuments();
            await loadSavedDocumentOptions();
        });

        loadDocuments();
        loadSavedDocumentOptions();


        async function loadSavedDocumentOptions() {
            savedDocumentId.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Select a saved document";
            savedDocumentId.append(placeholder);

            try {
                const response = await fetch("/documents");
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Could not load saved documents.");
                }

                for (const doc of data.documents) {
                    const option = document.createElement("option");
                    option.value = String(doc.id);
                    option.textContent = `${doc.filename} (ID: ${doc.id})`;
                    savedDocumentId.append(option);
                }

                if (data.documents.length === 0) {
                    placeholder.textContent = "No saved documents yet";
                }
            } catch (error) {
                placeholder.textContent = "Could not load saved documents";
                savedQuestionStatus.textContent = `Error: ${error.message}`;
            }
        }



        savedQuestionForm.addEventListener("submit", async(event) => {
            event.preventDefault();

            const id = savedDocumentId.value;
            const question = savedQuestion.value.trim();

            if (!id) {
                savedQuestionStatus.textContent = "Please select a document.";
                return;
            }

            if (!question) {
                savedQuestionStatus.textContent = "Please enter a question.";
                return;
            }

            savedQuestionButton.disabled = true;
            savedQuestionStatus.textContent = "Searching the saved document...";
            savedAnswerResult.replaceChildren();

            try {
                const response = await fetch(
                    `/documents/${encodeURIComponent(id)}/ask`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            question
                        })
                    }
                );

                const data = await response.json();
                console.log("Saved-document QA status:", response.status);
                console.log("Saved-document QA response:", data);

                if (!response.ok) {
                    throw new Error(data.detail || "Question answering failed.");
                }

                savedQuestionStatus.textContent =
                    `Answer generated for ${data.filename}.`;

                const heading = document.createElement("h3");
                heading.textContent = "Answer";

                const answer = document.createElement("p");
                answer.textContent = data.answer;

                const confidence = document.createElement("p");
                confidence.textContent =
                    `Model confidence: ${(Number(data.confidence) * 100).toFixed(1)}%`;

                savedAnswerResult.append(heading, answer, confidence);

                if (data.source_passage) {
                    const sourceHeading = document.createElement("h4");
                    sourceHeading.textContent = "Supporting passage";

                    const source = document.createElement("p");
                    source.textContent = data.source_passage;

                    savedAnswerResult.append(sourceHeading, source);
                }
            } catch (error) {
                console.error("Saved-document QA failed:", error);
                savedQuestionStatus.textContent = `Error: ${error.message}`;
            } finally {
                savedQuestionButton.disabled = false;
            }
        });
    </script>
</body>

</html>
